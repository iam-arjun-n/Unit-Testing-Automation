name: Automate Unit Testing

on:
  push:
    branches:
      - Development

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js (Node 20 required for CAP / UI5 / MBT)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install Node dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run unit tests (hard gate)
      - name: Run unit tests
        run: npm test

      # 5️⃣ Setup Java (required for MBT)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6️⃣ Install MBT
      - name: Install MBT
        run: npm install -g mbt

      # 7️⃣ Build MTA
      - name: MBT build
        run: mbt build -p=cf

      # 8️⃣ Install Cloud Foundry CLI (APT – reliable)
      - name: Install CF CLI
        run: |
          curl -fsSL https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudfoundry.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update
          sudo apt-get install -y cf8-cli

          cf --version

      # 9️⃣ Login to Cloud Foundry (CI-SAFE, ATOMIC)
      - name: CF Login
        run: |
          cf login \
            -a "$CF_API" \
            -u "$CF_USERNAME" \
            -p "$CF_PASSWORD" \
            -o "$CF_ORG" \
            -s "$CF_SPACE"
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}

      # 🔟 Deploy to Cloud Foundry
      - name: CF Deploy
        run: cf deploy mta_archives/*.mtar --confirm
